name: Deploy BURNED

on:
  push:
    branches: [main]
    paths: ['projects/burned/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/burned
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/burned/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:palette
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:bundle

  deploy-worker:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/burned
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/burned/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # v4 keeps the pre-installed-first resolution (verified in its dist): burned's own
      # lockfile-pinned wrangler (devDependency ^4.80.0) is what deploys — the action major
      # only moves the runner runtime node20 -> node24 (GitHub's 2026-06-16 forcing).
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: projects/burned

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/burned
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/burned/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Ensure the Pages project exists (idempotent). Created via direct-upload
      # so it has NO Cloudflare Git integration — avoids the failing
      # `pages-build-deployment` check that plagued the old "burned" project.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages project create burnedgame --production-branch=main || echo "project already exists — continuing"
      # v4 keeps the pre-installed-first resolution (verified in its dist): burned's own
      # lockfile-pinned wrangler (devDependency ^4.80.0) is what deploys — the action major
      # only moves the runner runtime node20 -> node24 (GitHub's 2026-06-16 forcing).
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=burnedgame --branch=main --commit-dirty=true
          workingDirectory: projects/burned
