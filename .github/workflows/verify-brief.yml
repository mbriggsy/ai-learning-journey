name: Verify the brief bench

# The tests of brief's measuring harness (projects/skills/distill-and-brief/brief/bench/): the
# copy builder, the scorer that applies the recall fix's bar, the merge and the blindness audit,
# plus a re-score of the committed results that must reproduce their verdict. They read git
# history at the benchmark's old commits, so the checkout is full (fetch-depth 0), and one test
# checks a lesson deleted from the live playbook folder is still gone, so that folder is in the
# path filter. Distill has no tests. Plain Node, no install step.

on:
  push:
    branches: [main]
    paths:
      - 'projects/skills/distill-and-brief/**'
      - 'playbook/docs/insights/**'
      - '.github/workflows/verify-brief.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Quoted, so Node expands the glob itself; a bare folder argument fails on Node 24.
      - run: node --test "projects/skills/distill-and-brief/brief/**/*.test.mjs"
