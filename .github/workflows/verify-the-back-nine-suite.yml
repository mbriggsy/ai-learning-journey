name: Verify The Back Nine (suite and browsers)

# The Back Nine's three long jobs, split from verify-the-back-nine.yml (the quick checks) so a push that
# changes only Markdown runs the quick job alone (Briggsy, 2026-11-22: "1 - totally", round 2 of the
# CI-frequency chat; the project CLAUDE.md's Test cadence). 110 of the 199 runs Nov 1-22 changed only
# docs, TODO, README or CLAUDE.md, and every one ran the ~30 min fit job. The quick job still runs on
# every push, so verify:doc-stats reads every doc change; no unit test, harness or build input reads a
# Markdown file except the doc-stats test, whose real-doc checks are doc-stats' own arms.
#   `verify-unit` — the vitest suite;
#   `verify-fit` — the real-Chromium vertical-fit + chart-text + phone intake-fold gates (one harness,
#     playwright.fit.config.ts; the critical path, ~26 min);
#   `verify-rv-chart-text` — the RecommendationViz chart-text gate on its own serialized solve harness
#     (three arms, each a full-precision solve on the worker pool — the whole step ran 5.4 min on CI at
#     53f1ae71, run 37166135388; 4.9–9.1 min across the green pooled runs 2026-10-04 → 2026-10-16, runs
#     38693180201 / 37221659495).
# A docs-only push therefore has no run here: read a session's suite and fit results on its last code
# commit. scripts/__tests__/ci-gate-completeness.test.ts reads both workflows and allows this file's one
# negated path and no other.

on:
  push:
    branches: [main]
    # Order matters: the project, minus its Markdown, plus this file (a change to the gate re-runs it).
    paths:
      - 'projects/the-back-nine/**'
      - '!projects/the-back-nine/**/*.md'
      - '.github/workflows/verify-the-back-nine-suite.yml'
  pull_request:
    paths:
      - 'projects/the-back-nine/**'
      - '!projects/the-back-nine/**/*.md'
      - '.github/workflows/verify-the-back-nine-suite.yml'
  # PINNED to ubuntu-26.04, never `ubuntu-latest` (verify-the-back-nine.yml carries the history). To change
  # image: dispatch with `runner` set to the candidate, and move the pin only after it lands green.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for every job
        type: choice
        options: [ubuntu-26.04, ubuntu-24.04]
        default: ubuntu-26.04

jobs:
  # THE SPLIT (Briggsy, 2026-11-22: "approved", the CI-frequency chat's round 1). These ran as ONE chain
  # inside `verify` until then, verify:fit last, so any earlier red (a doc number, a stale ACA record)
  # stopped the job before the fit gate printed a single frame. As their own jobs a cheap red no longer
  # hides the fit readings, and the run's wall clock is the fit job's alone (the suite's ~10 min runs beside it).
  verify-unit:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      # `version` is REQUIRED (verify-the-back-nine.yml says why: no root package.json in this monorepo).
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  verify-fit:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The real-browser VERTICAL-FIT gate (council 2026-07-08): the one-frame fit law
      # (--laptop-fit-height) + the date-route order contract, plus the chart-text gate (2026-09-05)
      # and the phone intake-fold gate (2026-09-08), driven through `pnpm dev` on its own harness
      # (playwright.fit.config.ts) — the ?seed= routes it measures are DCE'd out of dist/, so it
      # cannot ride the CSP harness. Needs no dist/, and Chromium alone.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:fit
      # Its own report artifact (a distinct name — two jobs uploading `playwright-report` collide).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-fit
          path: projects/the-back-nine/playwright-report/
          retention-days: 14

  # The RecommendationViz chart-text gate — its OWN job, in parallel with the others: the one chart
  # that exists only after a full-precision (16k-path) worker solve, SERIALIZED (`workers: 1`,
  # playwright.fit-rv.config.ts) so each solve gets the whole runner. Beside verify:fit's date-seed
  # finals it would starve them of cores (the reason it is not in that harness); appended to
  # `verify-fit` it would double that job's wall-clock. Needs no dist/ — it drives `pnpm dev`'s
  # `?seed=surplus` route on its own port (4192), so it installs and boots on its own.
  verify-rv-chart-text:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:fit:rv
      # Its own report artifact (a distinct name — two jobs uploading `playwright-report` collide).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-rv
          path: projects/the-back-nine/playwright-report/
          retention-days: 14
