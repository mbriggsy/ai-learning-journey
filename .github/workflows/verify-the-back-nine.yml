name: Verify The Back Nine

# Unlike verify-ai-journey-stats.yml (build-only), the-back-nine's engine + crypto
# ARE the product, so CI runs the FULL gate — eleven scripts across two parallel jobs:
# `verify` — ACA re-verify, state-tax re-verify, lint (layer boundaries + engine
# purity), typecheck, doc-stats, tests, build, the initial-JS byte budget, the
# real-Chromium CSP enforcement walk and the real-Chromium vertical-fit + chart-text
# gate; `verify-rv-chart-text` — the RecommendationViz chart-text gate on its own
# serialized solve harness (three ~6–8 min arms, each a full-precision solve).

on:
  push:
    branches: [main]
    # Include this workflow file so a change to the gate itself re-runs the gate
    # (it lives outside projects/the-back-nine/, so the project path alone misses it).
    paths:
      - 'projects/the-back-nine/**'
      - '.github/workflows/verify-the-back-nine.yml'
  pull_request:
    paths:
      - 'projects/the-back-nine/**'
      - '.github/workflows/verify-the-back-nine.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      # `version` is REQUIRED here: action-setup runs at the repo ROOT (it ignores
      # defaults.run.working-directory), and this monorepo has no root package.json,
      # so it can't read the project's `packageManager` pin. `version: 10` is the
      # proven house pattern (matches deploy-burned.yml + verify-ai-journey-stats.yml);
      # the lockfile is the actual dependency-reproducibility guarantee.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fail fast on a stale/unconfirmed ACA legislative assumption.
      - run: pnpm verify:aca
      # Fail fast on a stale/unconfirmed/missing state-tax record (the priced roster {NC,PA,FL} —
      # all on the same ANNUAL drift cadence but each on its OWN nextDue; NC's ~Aug-2026 checkpoint was
      # retired 2026-08-02 when S.L. 2026-41 struck the trigger rows). Reds in TWO waves 18 days apart, earliest record first. Mirrors verify:aca.
      - run: pnpm verify:state-tax
      - run: pnpm lint
      - run: pnpm typecheck
      # The doc test-count DRIFT gate. It was local-only until 2026-07-26, which is exactly how a
      # commit adding 2 test arms without touching README/roadmap went GREEN through this workflow:
      # the law says every stat surface updates in ONE pass, and the gate enforcing it was the one
      # gate CI never ran. `vitest list` only enumerates (it does not execute), so this is cheap and
      # belongs here, ahead of the slow suite, to fail fast.
      - run: pnpm verify:doc-stats
      - run: pnpm test
      - run: pnpm build
      # Needs dist/ — runs after build.
      - run: pnpm verify:bundle
      # Browser ENFORCEMENT of the strict CSP — the in-memory decrypted model's only guard (at-rest
      # crypto does nothing for cleartext in the JS heap). The vitest guard checks the vercel.json
      # STRING; this serves dist/ through a header-applying harness and asserts a real Chromium blocks
      # an injected inline script + still constructs the engine worker. --with-deps pulls the OS libs
      # the headless browsers need on ubuntu. WebKit is installed for the @cross-browser vault arms
      # ONLY — playwright.config.ts's second project greps for that tag, so CSP enforcement itself is
      # still proven in Chromium alone, and firefox is still untested.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm verify:csp
      # The real-browser VERTICAL-FIT gate (council 2026-07-08): the one-frame fit law
      # (--laptop-fit-height) + the date-route order contract, driven through `pnpm dev` on its own
      # harness (playwright.fit.config.ts) — the ?seed= routes it measures are DCE'd out of dist/,
      # so it cannot ride the CSP harness above. Needs no dist; chromium is already installed.
      - run: pnpm verify:fit
      # Surface the HTML report (+ traces) when the CSP e2e fails, so a CI-only failure is debuggable.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: projects/the-back-nine/playwright-report/
          retention-days: 14

  # The RecommendationViz chart-text gate — its OWN job, in parallel with `verify`: the one chart
  # that exists only after a full-precision (16k-path) worker solve, ~6–8 min per arm × three arms,
  # SERIALIZED (`workers: 1`, playwright.fit-rv.config.ts) so each solve gets the whole runner.
  # Beside verify:fit's date-seed finals it would starve them of cores (the reason it is not in that
  # harness); appended to the job above it would double its wall-clock. Needs no dist/ — it drives
  # `pnpm dev`'s `?seed=surplus` route on its own port (4192), so it installs and boots on its own.
  verify-rv-chart-text:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:fit:rv
      # Its own report artifact (a distinct name — two jobs uploading `playwright-report` collide).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-rv
          path: projects/the-back-nine/playwright-report/
          retention-days: 14
