name: Verify The Back Nine

# Unlike verify-ai-journey-stats.yml (build-only), the-back-nine's engine + crypto
# ARE the product, so CI runs the FULL gate across two workflows. This one is the QUICK job,
# `verify`, on every push that touches the project, Markdown included: ACA re-verify, state-tax
# re-verify, lint (layer boundaries + engine purity), typecheck, doc-stats, build and the
# real-Chromium CSP enforcement walk (~3 min). The suite, the fit gate and the
# RecommendationViz chart-text gate live in verify-the-back-nine-suite.yml, which skips a push that
# changes only Markdown (Briggsy, 2026-11-22: docs-only pushes run only the quick job).

on:
  push:
    branches: [main]
    # Include this workflow file so a change to the gate itself re-runs the gate
    # (it lives outside projects/the-back-nine/, so the project path alone misses it).
    paths:
      - 'projects/the-back-nine/**'
      - '.github/workflows/verify-the-back-nine.yml'
  pull_request:
    paths:
      - 'projects/the-back-nine/**'
      - '.github/workflows/verify-the-back-nine.yml'
  # PINNED to ubuntu-26.04, never `ubuntu-latest` (that label moves under the gate with no commit —
  # it flips to Ubuntu 26 from 2026-10-19, actions/runner-images#14748). @playwright/test 1.60.0 could
  # not install Chromium there (run 37857970818); 1.63.0 can, and the full gate ran green on
  # ubuntu-26.04 at 2545d3e9 (run 37864060784) before this pin moved. To change image: dispatch with
  # `runner` set to the candidate, and move the pin only after it lands green. Push and PR runs carry
  # no inputs, so both jobs fall back to the pin.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for both jobs
        type: choice
        options: [ubuntu-26.04, ubuntu-24.04]
        default: ubuntu-26.04

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: projects/the-back-nine
    steps:
      - uses: actions/checkout@v6
      # `version` is REQUIRED here: action-setup runs at the repo ROOT (it ignores
      # defaults.run.working-directory), and this monorepo has no root package.json,
      # so it can't read the project's `packageManager` pin. `version: 10` is the
      # proven house pattern (matches deploy-burned.yml + verify-ai-journey-stats.yml);
      # the lockfile is the actual dependency-reproducibility guarantee.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/the-back-nine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fail fast on a stale/unconfirmed ACA legislative assumption.
      - run: pnpm verify:aca
      # Fail fast on a stale/unconfirmed/missing state-tax record (the priced roster {NC,PA,FL} —
      # all on the same ANNUAL drift cadence but each on its OWN nextDue; NC's ~Aug-2026 checkpoint was
      # retired 2026-08-02 when S.L. 2026-41 struck the trigger rows). Reds in TWO waves 18 days apart, earliest record first. Mirrors verify:aca.
      - run: pnpm verify:state-tax
      - run: pnpm lint
      - run: pnpm typecheck
      # The doc test-count DRIFT gate. It was local-only until 2026-07-26, which is exactly how a
      # commit adding 2 test arms without touching README/roadmap went GREEN through this workflow:
      # the law says every stat surface updates in ONE pass, and the gate enforcing it was the one
      # gate CI never ran. `vitest list` only enumerates (it does not execute), so this is cheap and
      # belongs in this quick job; since the 2026-11-22 split its red no longer stops the suite or the
      # fit gate, which run in their own jobs.
      - run: pnpm verify:doc-stats
      - run: pnpm build
      # Browser ENFORCEMENT of the strict CSP — the in-memory decrypted model's only guard (at-rest
      # crypto does nothing for cleartext in the JS heap). The vitest guard checks the vercel.json
      # STRING; this serves dist/ through a header-applying harness and asserts a real Chromium blocks
      # an injected inline script, a cross-origin fetch and an image-beacon exfil (each with a no-CSP
      # control arm), while the engine worker AND the pooled solve's coordinator + eval workers still
      # construct under worker-src 'self'. --with-deps pulls the OS libs the headless browsers need on
      # ubuntu. WebKit is installed for the @cross-browser vault arms ONLY — playwright.config.ts's
      # second project greps for that tag, so CSP enforcement itself is still proven in Chromium alone,
      # and firefox is still untested.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm verify:csp
      # Surface the HTML report (+ traces) when verify:csp fails, so a CI-only failure is debuggable.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: projects/the-back-nine/playwright-report/
          retention-days: 14
