name: Verify ultramode-plan

# The tests of the ultramode-plan skill and its head-to-head bench
# (projects/skills/ultramode-plan/; plan: its docs/plans/hybrid-plan-step-plan.md). The bench's
# freeze test copies the repo at the head-to-head's start commit (a3cd0b16), so the checkout is
# full (fetch-depth 0). The window gate's tests read real lines from the window skill
# (projects/skills/window/window.mjs), so that folder is in the path filter too. No test reads
# ~/.claude or starts claude. Plain Node, no install step.

on:
  push:
    branches: [main]
    paths:
      - 'projects/skills/ultramode-plan/**'
      - 'projects/skills/window/**'
      - '.github/workflows/verify-ultramode-plan.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Quoted, so Node expands the glob itself; a bare folder argument fails on Node 24. The TAP
      # report is kept for the next step; `shell: bash` runs with pipefail, so a failing test
      # still fails this step through the pipe.
      - shell: bash
        run: node --test --test-reporter=tap "projects/skills/ultramode-plan/**/*.test.mjs" | tee tap.txt
      # A test skipped for a missing environment counts as a failure (U2 of the plan). The only
      # skip allowed is a platform one, whose reason starts "platform:" (the 8.3 short-name tests,
      # which run on Windows only). A test marked todo passes whatever it finds, so it fails here
      # too, and so does a run that found no test at all (a quoted glob matching nothing exits 0).
      - shell: bash
        run: |
          grep -E '# SKIP' tap.txt || true
          if grep -E '# SKIP' tap.txt | grep -vE '# SKIP platform: '; then
            echo "A test skipped for a reason other than its platform: that counts as a failure."
            exit 1
          fi
          if grep -E '# TODO' tap.txt; then
            echo "A test is marked todo: it passes whatever it finds."
            exit 1
          fi
          if ! grep -qE '^# pass [1-9]' tap.txt; then
            echo "No test passed: the glob found no test file, or every test was skipped."
            exit 1
          fi
