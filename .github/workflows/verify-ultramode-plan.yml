name: Verify ultramode-plan

# The tests of the ultramode-plan skill and its head-to-head bench
# (projects/skills/ultramode-plan/; plan: its docs/plans/hybrid-plan-step-plan.md). The bench's
# freeze test copies the repo at the head-to-head's start commit (a3cd0b16), so the checkout is
# full (fetch-depth 0). No test reads ~/.claude or starts claude. Plain Node, no install step.

on:
  push:
    branches: [main]
    paths:
      - 'projects/skills/ultramode-plan/**'
      - '.github/workflows/verify-ultramode-plan.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Quoted, so Node expands the glob itself; a bare folder argument fails on Node 24.
      - run: node --test "projects/skills/ultramode-plan/**/*.test.mjs"
