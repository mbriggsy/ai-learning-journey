# claude-credit per-project config for BURNED.
#
# BURNED's trailer pipeline writes rendered .mp4 / .wav outputs to gitignored
# directories (videos/trailer/out/ and public/trailer/) — the repo is public
# and these renders are too big to commit. They ARE Claude+Briggsy work
# though, so we rescue them from .gitignore here so they count toward the
# credit total.

includeFromGitignore:
  - videos/trailer/out/**
  - public/trailer/**
  - public/trailer/audio/**
  - videos/trailer/sample-eval/**

# Generation logs — wired for v2; not yet read by v1.
generationLogs:
  - path: .claude-credit/generations.jsonl
    format: jsonl
    label: "Pipeline generations (Imagen / TTS / ffmpeg)"
