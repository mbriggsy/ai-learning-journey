# project-metrics per-project config for BURNED.
#
# BURNED's trailer pipeline writes rendered .mp4 / .wav outputs to gitignored
# directories — the repo is public and these renders are too big to commit.
# They ARE Claude+Briggsy work though, so we rescue them from .gitignore here
# so they count toward the credit total.
#   - videos/origin-trailer/out/  — the canonical v2 trailer (renders + Janet VO)
#   - public/trailer/             — v1 trailer output assets still on disk
# (v1 source dirs videos/trailer/* were deleted 2026-05-29, so their old rescue
#  paths are gone; v1 renders are recoverable via the `origin-trailer-v1` tag.)

includeFromGitignore:
  - videos/origin-trailer/out/**
  - public/trailer/**

# Generation logs — wired for v2; not yet read by v1.
generationLogs:
  - path: .project-metrics/generations.jsonl
    format: jsonl
    label: "Pipeline generations (Imagen / TTS / ffmpeg)"

# Editorial content for the ai-journey-stats showcase site (locked 2026-05-25).
editorial:
  oneLiner: "Couch-of-friends spy comedy. Archer-coded card game in the browser."
  hookStat:
    label: "CARDS"
    value: "120"
  liveUrl: "https://burnedgame.pages.dev/board"
  repoUrl: "https://github.com/mbriggsy/ai-learning-journey/tree/main/projects/burned"
  status: "active"
  description: "Real-time browser card game for 2–10 players on the couch. Built to prove a visual bar — Archer-coded illustration over Cloudflare Workers + Durable Objects."
