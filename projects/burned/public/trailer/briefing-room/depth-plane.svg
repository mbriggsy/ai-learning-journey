<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="M. Pendleton, Bureau Chief — engraved brass nameplate">
  <!--
    Depth-plane foreground element. HERO tier. BURNED origin trailer
    Unit 3.3 Step 7. Option A (brass nameplate) per plan default
    recommendation — strongest single narrative element (anchors the
    agency naming; reads at small dimensions; matches the existing
    pendleton-crest.png typographic family).

    Composition: 600×160, brass plate with diagonal specular gradient,
    inset bevel, four corner mounting screws, engraved-into-brass text.
    Top line = SERIF caps ("M. PENDLETON" — personal engraving register).
    Sub line = MONO caps ("BUREAU CHIEF" — institutional register). The
    mixed register is motivated: real-world brass plates from the 60s
    used different typographic conventions for the name vs. the title.

    Phase 4 sits this in the foreground bottom-edge of S02 with subtle
    drift parallax against the venetian-blind shadow plate behind.
  -->

  <defs>
    <!-- Diagonal brass gradient — off-axis specular, NOT vertical. -->
    <linearGradient id="brassFinish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5a4514" />
      <stop offset="22%"  stop-color="#947226" />
      <stop offset="46%"  stop-color="#c98a5c" />
      <stop offset="58%"  stop-color="#edb182" />
      <stop offset="72%"  stop-color="#c98a5c" />
      <stop offset="100%" stop-color="#5a4514" />
    </linearGradient>

    <!-- Inset bevel: light from upper-left, deeper shadow lower-right. -->
    <linearGradient id="bevelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe9b9" stop-opacity="0.78" />
      <stop offset="14%"  stop-color="#ffe9b9" stop-opacity="0.20" />
      <stop offset="50%"  stop-color="#ffe9b9" stop-opacity="0.00" />
      <stop offset="86%"  stop-color="#2b1d05" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#2b1d05" stop-opacity="0.70" />
    </linearGradient>

    <!-- Brushed-brass horizontal striation. Subtle. -->
    <pattern id="brassBrush" x="0" y="0" width="600" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="600" height="1.4" fill="#000" opacity="0.04" />
      <rect x="0" y="1.4" width="600" height="0.6" fill="#fff" opacity="0.03" />
    </pattern>

    <!-- Engraved-text shadow: dark ochre with downward offset, then
         a lighter hairline above the glyph to sell the depression. -->
    <filter id="engraved" x="-5%" y="-5%" width="110%" height="120%">
      <feOffset in="SourceAlpha" dx="0" dy="1.2" result="downShadow" />
      <feGaussianBlur in="downShadow" stdDeviation="0.6" result="blurDown" />
      <feFlood flood-color="#1a0d05" flood-opacity="0.72" />
      <feComposite in2="blurDown" operator="in" result="darkDown" />
      <feOffset in="SourceAlpha" dx="0" dy="-0.6" result="upHi" />
      <feGaussianBlur in="upHi" stdDeviation="0.3" result="blurUp" />
      <feFlood flood-color="#fff4d0" flood-opacity="0.40" />
      <feComposite in2="blurUp" operator="in" result="lightUp" />
      <feMerge>
        <feMergeNode in="darkDown" />
        <feMergeNode in="lightUp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cast shadow from plate onto desk surface. -->
    <filter id="plateDrop" x="-8%" y="-8%" width="116%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="2" dy="6" result="dropOff" />
      <feFlood flood-color="#000" flood-opacity="0.42" />
      <feComposite in2="dropOff" operator="in" result="dropShadow" />
      <feMerge>
        <feMergeNode in="dropShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#plateDrop)">
    <!-- Plate body -->
    <rect x="18" y="14" width="564" height="132" rx="3" ry="3" fill="url(#brassFinish)" />
    <!-- Brushed striation -->
    <rect x="18" y="14" width="564" height="132" rx="3" ry="3" fill="url(#brassBrush)" />
    <!-- Inset bevel highlight + shadow -->
    <rect x="18" y="14" width="564" height="132" rx="3" ry="3" fill="url(#bevelLight)" />
    <!-- Inner-edge darker hairline (recessed feel) -->
    <rect x="20.5" y="16.5" width="559" height="127" rx="2" ry="2"
          fill="none" stroke="#2b1d05" stroke-opacity="0.55" stroke-width="0.8" />
    <!-- Outer hairline highlight (catching the room light) -->
    <rect x="18.4" y="14.4" width="563.2" height="131.2" rx="3" ry="3"
          fill="none" stroke="#ffe9b9" stroke-opacity="0.62" stroke-width="0.8" />

    <!-- Corner screws — phillips-head, dark cordovan center, brass surround -->
    <g>
      <circle cx="38"  cy="34"  r="4.8" fill="#5a4514" />
      <circle cx="38"  cy="34"  r="3.4" fill="#947226" />
      <line x1="35.4" y1="31.4" x2="40.6" y2="36.6" stroke="#1a0d05" stroke-width="0.9" />
      <line x1="40.6" y1="31.4" x2="35.4" y2="36.6" stroke="#1a0d05" stroke-width="0.9" />

      <circle cx="562" cy="34"  r="4.8" fill="#5a4514" />
      <circle cx="562" cy="34"  r="3.4" fill="#947226" />
      <line x1="559.4" y1="31.4" x2="564.6" y2="36.6" stroke="#1a0d05" stroke-width="0.9" />
      <line x1="564.6" y1="31.4" x2="559.4" y2="36.6" stroke="#1a0d05" stroke-width="0.9" />

      <circle cx="38"  cy="126" r="4.8" fill="#5a4514" />
      <circle cx="38"  cy="126" r="3.4" fill="#947226" />
      <line x1="35.4" y1="123.4" x2="40.6" y2="128.6" stroke="#1a0d05" stroke-width="0.9" />
      <line x1="40.6" y1="123.4" x2="35.4" y2="128.6" stroke="#1a0d05" stroke-width="0.9" />

      <circle cx="562" cy="126" r="4.8" fill="#5a4514" />
      <circle cx="562" cy="126" r="3.4" fill="#947226" />
      <line x1="559.4" y1="123.4" x2="564.6" y2="128.6" stroke="#1a0d05" stroke-width="0.9" />
      <line x1="564.6" y1="123.4" x2="559.4" y2="128.6" stroke="#1a0d05" stroke-width="0.9" />
    </g>

    <!-- Engraved text: name (SERIF, large) + title (MONO, letter-spaced) -->
    <g filter="url(#engraved)">
      <text x="300" y="74" text-anchor="middle"
            font-family="'Cormorant Garamond', 'EB Garamond', 'Garamond', Georgia, 'Times New Roman', serif"
            font-weight="600" font-size="38"
            fill="#3c2d0c" letter-spacing="2.4">M. PENDLETON</text>
      <text x="300" y="114" text-anchor="middle"
            font-family="'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace"
            font-weight="700" font-size="16"
            fill="#2b1d05" letter-spacing="7.2">BUREAU CHIEF</text>
    </g>
  </g>
</svg>
