<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240"
     role="presentation" aria-hidden="true"
     style="--ink: var(--color-ochre-9, #947226)">
  <!--
    R15 #1 classification stamp — FRAME LAYER. CHROME tier.
    Phase 3 Unit 3.4 / Phase 1 Unit 1.9 R15 lock.

    IDENTITY SPACE: no rotation, no scale baked in. Phase 4 wraps
    both frame + text layers in a single <AbsoluteFill> with
    transform-origin:center + rotate(-8deg) + scaleSlap(frame) for
    Phase 1 Unit 1.4 stamp-slap motion (0.95 → 1.04 → 1.0).

    Double-border (outer 6px + inner hairline 1.5px) sells "official
    rubber-stamp" vocabulary. Ink-bleed filter matches Stamp.tsx
    canonical params (Unit 3.0 vendored vocabulary cross-reference).
  -->
  <defs>
    <filter id="inkBleed" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" />
      <feDisplacementMap in="SourceGraphic" scale="2.2" />
    </filter>
  </defs>
  <g style="color: var(--ink)" filter="url(#inkBleed)">
    <!-- Outer border -->
    <rect x="40" y="20" width="720" height="200"
          fill="none" stroke="currentColor" stroke-width="6" />
    <!-- Inner hairline -->
    <rect x="54" y="34" width="692" height="172"
          fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.78" />
  </g>
</svg>
