<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280"
     role="presentation" aria-hidden="true"
     style="--ink: var(--color-burned-fire, #be2e27)">
  <!--
    R15 #3 stacked-payoff stamp — FRAME LAYER. HERO tier.
    S04 frame 1950 — the trailer's load-bearing visual stamp moment.

    Heavier ink-bleed (baseFreq 0.7, numOctaves 3, scale 4.8) sells
    "hand-stamped" not "CSS noise" — insight #050 perceptual
    continuity. Double-border + 4 corner bracket marks read as
    institutional-stamp vocabulary (FBI / classified-file iconography)
    rather than generic decorative rectangle.

    Burn-fire ink (#be2e27) per Phase 1 Unit 1.8 lock — NOT #c63b1e
    that pre-deepening Phase 3 had. CVD-verified 2026-05-22 (probe
    script clears STRICT floor 0.10 against cream-11 + cream-12).

    Phase 4 wraps with rotate(-3deg) + scaleSlap (heavier 16-frame
    slap per Phase 1 Unit 1.4 lock).
  -->
  <defs>
    <filter id="heavyInkBleed" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="4.8" />
    </filter>
  </defs>
  <g style="color: var(--ink)" filter="url(#heavyInkBleed)">
    <!-- Outer border -->
    <rect x="40" y="20" width="1120" height="240"
          fill="none" stroke="currentColor" stroke-width="8" />
    <!-- Inner hairline -->
    <rect x="58" y="38" width="1084" height="204"
          fill="none" stroke="currentColor" stroke-width="2" opacity="0.82" />

    <!-- Corner bracket marks — small L-shaped accents 16px in from each corner.
         Reads as classification-file framing without being decorative jewelry. -->
    <!-- TL -->
    <path d="M 76 56 L 76 72 L 92 72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" />
    <!-- TR -->
    <path d="M 1124 56 L 1124 72 L 1108 72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" />
    <!-- BL -->
    <path d="M 76 224 L 76 208 L 92 208" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" />
    <!-- BR -->
    <path d="M 1124 224 L 1124 208 L 1108 208" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" />
  </g>
</svg>
