<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280"
     role="img" aria-label="AUTONOMOUS FIELD UNIT — ASSET DELIVERED"
     style="--ink: var(--color-burned-fire, #be2e27)">
  <!--
    R15 #3 stacked-payoff stamp — TEXT LAYER. HERO tier.
    Phase 1 Unit 1.9 locked copy. The trailer's R3 payoff carrier —
    visual stamp + audio reveal land simultaneously at frame 1950.

    Line 1 ("AUTONOMOUS FIELD UNIT") at 38px establishes who; line 2
    ("ASSET DELIVERED") at 42px lands harder — the payoff verb.

    Heaviest ink-bleed (matches frame layer parameters) so frame + text
    composite as one stamped impression rather than reading as two
    separately-displaced layers.
  -->
  <defs>
    <filter id="heavyInkBleed" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="4.8" />
    </filter>
  </defs>
  <g style="color: var(--ink)" filter="url(#heavyInkBleed)">
    <text x="600" y="124" text-anchor="middle"
          font-family="'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace"
          font-weight="700" font-size="38"
          fill="currentColor" letter-spacing="5.2">AUTONOMOUS FIELD UNIT</text>
    <text x="600" y="204" text-anchor="middle"
          font-family="'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace"
          font-weight="800" font-size="46"
          fill="currentColor" letter-spacing="6.4">ASSET DELIVERED</text>
  </g>
</svg>
