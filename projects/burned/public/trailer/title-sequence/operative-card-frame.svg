<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"
     role="img" aria-label="Operative card frame template"
     style="--ink: var(--color-ochre-9, #947226); --accent: var(--color-burned-fire, #be2e27)">
  <!--
    Cold-open operative card-flash chrome template. HERO tier.
    Phase 3 Unit 3.6 Step 1b — hand-authored SVG fallback path
    (skipped Imagen escalation per insight #018 stop-gate +
    feedback-imagen-budget.md "one-test-first" preference).

    Phase 4 composes:
      <Img src="frame.svg" />
      <Img src="<operative-portrait>.webp" /> over center region
      <text>OPERATIVE NAME</text> in Clash Display 700 over bottom strip

    Design notes:
      - Bold 12px ochre-9 border + 2px inner hairline at 0.6 opacity =
        institutional file-card weight.
      - Target-reticle upper-right (60r outer, 40r mid, 4r center burn-
        fire dot + 4 compass-direction line ticks) — Archer freeze-
        frame iconography.
      - Center portrait region is INTENTIONALLY empty (light charcoal
        wash at 0.10 opacity as a placement guide; Phase 4 covers).
      - Bottom name-plate strip = solid ochre-9 fill, 720×120, ready
        for Phase 4's Clash Display 700 name overlay in cream-1.
      - Chevron tick marks flanking the name-plate echo the chevron-
        motif-bg.svg pattern — visual DNA continuity across cold-open
        elements.
      - Small `// OPERATIVE FILE` kicker label in the upper-left of
        the portrait region — sits in the "padding" area Phase 4's
        portrait covers, but renders for any composition where the
        portrait sits inset.
  -->

  <!-- Bold border + inner hairline -->
  <rect x="20" y="20" width="760" height="960" fill="none"
        stroke="var(--ink)" stroke-width="12" />
  <rect x="44" y="44" width="712" height="912" fill="none"
        stroke="var(--ink)" stroke-width="2" opacity="0.62" />

  <!-- Target-reticle motif, upper-right corner -->
  <g transform="translate(680 90)" style="color: var(--ink)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="currentColor" stroke-width="3" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="currentColor" stroke-width="2" opacity="0.82" />
    <circle cx="0" cy="0" r="4"  fill="var(--accent)" />
    <!-- Compass-direction line ticks -->
    <line x1="-80" y1="0"  x2="-65" y2="0"  stroke="currentColor" stroke-width="3" />
    <line x1="65"  y1="0"  x2="80"  y2="0"  stroke="currentColor" stroke-width="3" />
    <line x1="0"   y1="-80" x2="0"   y2="-65" stroke="currentColor" stroke-width="3" />
    <line x1="0"   y1="65"  x2="0"   y2="80"  stroke="currentColor" stroke-width="3" />
  </g>

  <!-- Center portrait placement region (Phase 4 covers with <Img>) -->
  <rect x="80" y="100" width="640" height="740"
        fill="var(--color-charcoal-3, #1a1812)" opacity="0.10" />

  <!-- Upper-left kicker label (renders for compositions where portrait insets) -->
  <text x="80" y="92" text-anchor="start"
        font-family="'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-weight="600" font-size="14"
        fill="var(--ink)" letter-spacing="2.8">// OPERATIVE FILE</text>

  <!-- File code, upper-right offset from reticle -->
  <text x="624" y="92" text-anchor="end"
        font-family="'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-weight="600" font-size="14"
        fill="var(--ink)" letter-spacing="2.8">PEN · 62 · 02</text>

  <!-- Bottom name-plate strip -->
  <rect x="40" y="860" width="720" height="100" fill="var(--ink)" />

  <!-- Chevron flanks echoing the chevron-motif-bg vocabulary -->
  <g style="color: var(--color-charcoal-3, #1a1812)">
    <!-- Left flank: two chevrons pointing right -->
    <path d="M 56 890 L 76 910 L 56 930" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.78" />
    <path d="M 80 890 L 100 910 L 80 930" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.42" />
    <!-- Right flank: two chevrons pointing left -->
    <path d="M 744 890 L 724 910 L 744 930" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.78" />
    <path d="M 720 890 L 700 910 L 720 930" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.42" />
  </g>
</svg>
