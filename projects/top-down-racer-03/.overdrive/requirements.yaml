requirements:
  R-001:
    text: The simulation engine (src/engine/) must have zero modifications from v02
    type: constraint
    source: What Is NOT Changing — Simulation engine
    priority: must
    estimated_phase: null
    verification_method: inspection — diff src/engine/ against v02, expect zero changes
    notes: Sacred constraint. 366+ tests, deterministic, 13K ticks/sec.
  R-002:
    text: The engine/renderer architectural boundary must have zero cross-layer imports
    type: constraint
    source: What Is NOT Changing — Engine/renderer boundary
    priority: must
    estimated_phase: null
    verification_method: static analysis — grep for engine imports in renderer code and vice versa
    notes: Non-negotiable foundation per spec.
  R-003:
    text: The renderer must only read engine state and never mutate game logic
    type: constraint
    source: ADR-01, CLAUDE.md
    priority: must
    estimated_phase: null
    verification_method: code review — renderer has no write access to engine state objects
    notes: Enforced by the engine/renderer boundary.
  R-004:
    text: Track 1 (oval) geometry must remain unchanged from v02
    type: constraint
    source: What Is NOT Changing — Track 1 geometry
    priority: must
    estimated_phase: null
    verification_method: inspection — diff track01.ts geometry data against v02, expect identical
    notes: Track 1 is the AI training sanity check. Always has been.
  R-005:
    text: The project must use TypeScript as the primary implementation language
    type: constraint
    source: What Is NOT Changing — TypeScript + PixiJS v8 stack
    priority: must
    estimated_phase: null
    verification_method: inspection — all game source files are .ts
    notes: TypeScript strict mode per v02 conventions.
  R-006:
    text: The project must use PixiJS v8 with WebGL as the rendering engine
    type: constraint
    source: ADR-01
    priority: must
    estimated_phase: null
    verification_method: inspection — package.json contains pixi.js v8.x dependency
    notes: No Three.js, Babylon.js, or WebGPU. PixiJS v8 handles everything needed.
  R-007:
    text: The project must use Vitest for TypeScript test infrastructure
    type: constraint
    source: What Is NOT Changing — Vitest + pytest
    priority: must
    estimated_phase: null
    verification_method: inspection — package.json contains vitest dependency, test files use vitest
    notes: Add renderer visual tests, don't replace existing infrastructure.
  R-008:
    text: The project must use pytest for Python test infrastructure
    type: constraint
    source: What Is NOT Changing — Vitest + pytest
    priority: must
    estimated_phase: null
    verification_method: inspection — Python tests use pytest framework
    notes: AI training pipeline tests.
  R-009:
    text: The application must be statically deployable with no server infrastructure
    type: constraint
    source: What Is NOT Changing — Static deployment
    priority: must
    estimated_phase: null
    verification_method: inspection — no server-side code, all assets served as static files
    notes: Described as a feature, not a limitation.
  R-010:
    text: The application must not include any multiplayer functionality
    type: constraint
    source: Locked Design Decisions
    priority: must
    estimated_phase: null
    verification_method: inspection — no networking code, no multiplayer features
    notes: Explicitly locked. 'Absolutely not. Wrong project. Wrong conversation.'
  R-011:
    text: The application must have exactly three tracks — no fourth track added
    type: constraint
    source: Locked Design Decisions
    priority: must
    estimated_phase: null
    verification_method: inspection — track registry contains exactly 3 tracks
    notes: Tracks 2 and 3 are redesigned but no new tracks added.
  R-012:
    text: The physics engine must not be modified
    type: constraint
    source: Locked Design Decisions
    priority: must
    estimated_phase: null
    verification_method: inspection — physics code identical to v02
    notes: Any physics question is out of scope for v03.
  R-013:
    text: Cars must be implemented as static top-down sprites with PixiJS-native continuous rotation (no animation rigs)
    type: constraint
    source: ADR-03, Locked Design Decisions
    priority: must
    estimated_phase: 2
    verification_method: inspection — car rendering uses sprite.rotation, no Spine/DragonBones
    notes: No Spine or DragonBones. PixiJS handles rotation natively.
  R-014:
    text: The v02 ONNX model must be retired and not used in v03 production
    type: constraint
    source: ADR-13, CLAUDE.md
    priority: must
    estimated_phase: 5
    verification_method: inspection — v02 ONNX file not referenced in v03 codebase
    notes: v02 model memorized v02 Track 3 geometry. Must be replaced.
  R-015:
    text: AI retraining must use full PPO from scratch, not transfer learning from v02
    type: constraint
    source: ADR-13
    priority: must
    estimated_phase: 5
    verification_method: inspection — training script initializes fresh model, no v02 weights loaded
    notes: Transfer learning from a memorized model could produce worse convergence.
  R-016:
    text: The reward function must be shipped unchanged from v02
    type: constraint
    source: ADR-13
    priority: must
    estimated_phase: 5
    verification_method: inspection — diff reward function against v02, expect identical
    notes: Worked on first run with zero tuning. Do not touch until specific training failure.
